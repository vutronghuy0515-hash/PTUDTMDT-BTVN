<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS 4 - Menu ngang</title>

    <style>
        ul {
            list-style: none;
            padding: 0;
            margin: 40px 0;
            text-align: center;
        }

        li {
            display: inline-block;
            width: 120px;
            margin: 0 3px;
            background-color: aqua;
            text-align: center;
        }

        li a {
            display: block;
            padding: 3px 0;
            font-size: 25px;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>
</body>
</html>
