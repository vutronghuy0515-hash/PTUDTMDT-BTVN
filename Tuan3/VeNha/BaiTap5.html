<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Best Shared Hosting Company</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333333;
            background-color: white;
        }

        .best-shared {
            max-width: 1100px;
            margin: 55px auto;
            padding: 15px;
            text-align: center;
        }

        .logo {
            margin-bottom: 25px;
        }

        .logo img {
            width: 200px;
        }

        .best-shared h2 {
            font-size: 34px;
            font-weight: 300;
            margin: 20px 0;
        }

        .best-shared h2 strong {
            color: #00A7D6;
        }

        .lead-text {
            font-size: 14px;
            line-height: 1.6;
            margin: 25px 0 45px;
        }

        .btn-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .btn-list li {
            display: inline-block;
            margin: 0 7px;
        }

        .btn-list a {
            display: inline-block;
            padding: 16px 30px;
            background-color: #303238;
            color: white;
            text-decoration: none;
            border-radius: 3px;
        }

        .btn-list a:hover {
            background-color: #00A7D6;
        }

</head>

<body>

    <section class="best-shared">

        <p class="logo">
            <img
                src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png"
                alt="Logo BIT">
        </p>

        <h2>
            Best <strong>Shared Hosting</strong> Company
        </h2>

        <p class="lead-text">
            With this responsive landing page template,
            you can promote your all hosting, domain
            and email services.
        </p>

        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>

</html>
